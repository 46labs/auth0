apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth0.fullname" . }}
  labels:
    {{- include "auth0.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "auth0.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # subPath mounts do not refresh in a running container, and the server
        # reads config only at startup, so a config change has to roll the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "auth0.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: auth0
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.port }}
          protocol: TCP
        env:
        - name: ISSUER
          value: {{ .Values.config.issuer | quote }}
        - name: AUDIENCE
          value: {{ .Values.config.audience | quote }}
        - name: PORT
          value: {{ .Values.config.port | quote }}
        {{- if .Values.config.corsOrigins }}
        - name: CORSORIGINS
          value: {{ join "," .Values.config.corsOrigins | quote }}
        {{- end }}
        volumeMounts:
        # The server reads /config/config.yaml. Without this mount the whole
        # config ConfigMap is rendered and then ignored, leaving the image's
        # baked-in fixtures in charge.
        - name: config
          mountPath: /config/config.yaml
          subPath: config.yaml
        {{- if .Values.customLogin.enabled }}
        - name: custom-login
          mountPath: /config/login.html
          subPath: login.html
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "auth0.fullname" . }}
      {{- if .Values.customLogin.enabled }}
      - name: custom-login
        configMap:
          name: {{ include "auth0.fullname" . }}-login
      {{- end }}
