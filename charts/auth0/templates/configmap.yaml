apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth0.fullname" . }}
  labels:
    {{- include "auth0.labels" . | nindent 4 }}
data:
  config.yaml: |
    issuer: {{ .Values.config.issuer }}
    audience: {{ .Values.config.audience }}
    port: {{ .Values.config.port }}
    corsOrigins:
    {{- range .Values.config.corsOrigins }}
    - {{ . }}
    {{- end }}
    users:
    {{- toYaml .Values.config.users | nindent 4 }}
    branding:
      {{- toYaml .Values.config.branding | nindent 6 }}
    {{- with .Values.config.organizations }}
    organizations:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.connections }}
    connections:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.roles }}
    roles:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.members }}
    members:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.organizationConnections }}
    organizationConnections:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.clients }}
    clients:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.actions }}
    actions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
{{- if .Values.customLogin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth0.fullname" . }}-login
  labels:
    {{- include "auth0.labels" . | nindent 4 }}
data:
  login.html: |
{{ .Values.customLogin.html | indent 4 }}
{{- end }}
