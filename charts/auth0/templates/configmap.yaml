apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth0.fullname" . }}
  labels:
    {{- include "auth0.labels" . | nindent 4 }}
data:
  config.yaml: |
    issuer: {{ .Values.config.issuer }}
    audience: {{ .Values.config.audience }}
    {{- with .Values.config.apis }}
    apis:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    port: {{ .Values.config.port }}
    {{- if .Values.logStreamCA.secretName }}
    logStreamCAFile: /config/log-stream-ca/{{ .Values.logStreamCA.key }}
    {{- end }}
    {{- with .Values.config.deviceCodeLifetime }}
    deviceCodeLifetime: {{ . | quote }}
    {{- end }}
    corsOrigins:
    {{- range .Values.config.corsOrigins }}
    - {{ . | quote }}
    {{- end }}
    {{- /* An empty list must render inline: "users:" over a bare "[]" is not YAML. */}}
    {{- if .Values.config.users }}
    users:
    {{- toYaml .Values.config.users | nindent 4 }}
    {{- else }}
    users: []
    {{- end }}
    branding:
      {{- toYaml .Values.config.branding | nindent 6 }}
    {{- with .Values.config.organizations }}
    organizations:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.connections }}
    connections:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.roles }}
    roles:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.members }}
    members:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.organizationConnections }}
    organizationConnections:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.clients }}
    clients:
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.config.actions }}
    actions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
{{- if .Values.customLogin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth0.fullname" . }}-login
  labels:
    {{- include "auth0.labels" . | nindent 4 }}
data:
  login.html: |
{{ .Values.customLogin.html | indent 4 }}
{{- end }}
---
{{- if .Values.customDevice.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth0.fullname" . }}-device
  labels:
    {{- include "auth0.labels" . | nindent 4 }}
data:
  device.html: |
{{ .Values.customDevice.html | indent 4 }}
{{- end }}
