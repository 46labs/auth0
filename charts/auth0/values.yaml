image:
  repository: ghcr.io/46labs/auth0
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  host: auth.46labs.test
  tls:
    enabled: false
    secretName: ""

config:
  issuer: https://auth.46labs.test/
  audience: https://api.46labs.test
  port: 3000
  corsOrigins:
    - "*"
  users:
    - user_id: user_1
      phone: "+14155551234"
      email: test@46labs.test
      name: Test User
  # Organization invitations need a non-passwordless connection and a client
  # with an initiate_login_uri, so both are rendered by the configmap.
  organizations: []
  connections: []
  roles: []
  members: []
  organizationConnections: []
  clients: []
  actions: {}
  branding:
    serviceName: Auth Service
    logoUrl: ""
    primaryColor: "#3b82f6"
    title: Sign In
    subtitle: Enter your phone number

customLogin:
  enabled: false
  html: ""
