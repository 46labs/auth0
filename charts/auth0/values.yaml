image:
  repository: ghcr.io/46labs/auth0
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  host: auth.46labs.test
  tls:
    enabled: false
    secretName: ""

# CA trusted when delivering to log streams, for a receiver behind a locally
# issued certificate. A Secret holding the PEM bundle under key; empty trusts
# the system pool only.
logStreamCA:
  secretName: ""
  key: ca.crt

# Signing key, so tokens and cached key sets survive restarts. A Secret
# holding a PEM RSA private key (PKCS#1 or PKCS#8) under key; tls.key fits a
# cert-manager Certificate with privateKey.algorithm RSA and rotationPolicy
# Never. Empty generates a key at each start, and its kid changes with it.
signingKey:
  secretName: ""
  key: tls.key

config:
  issuer: https://auth.46labs.test/
  audience: https://api.46labs.test
  # Further APIs a login may name with ?audience=; audience is the default.
  # - identifier: https://other.46labs.test
  #   name: Other
  apis: []
  # The default audience's sender constraining, as Auth0's resource server
  # proof_of_possession; an API in apis takes proof_of_possession the same way.
  # proofOfPossession:
  #   mechanism: dpop
  #   required: true
  port: 3000
  corsOrigins:
    - "*"
  users:
    - user_id: user_1
      phone: "+14155551234"
      email: test@46labs.test
      name: Test User
  # Organization invitations need a non-passwordless connection and a client
  # with an initiate_login_uri, so both are rendered by the configmap.
  organizations: []
  connections: []
  roles: []
  members: []
  organizationConnections: []
  clients: []
  actions: {}
  branding:
    serviceName: Auth Service
    logoUrl: ""
    primaryColor: "#3b82f6"
    title: Sign In
    subtitle: Enter your phone number

customLogin:
  enabled: false
  html: ""

# Mounted at /config/device.html for the /device verification page.
customDevice:
  enabled: false
  html: ""
